name: build_and_push_to_docker_hub
on:
  push:
    branches: dev
  workflow_dispatch:
    inputs:
      IMAGE_NAME_DEV:
        description: "Docker image name for development"
        type: string
        default: joelrobinson791/capstone-app-dev
        required: true
permissions: read-all
jobs:
  pre-build:
    runs-on: ubuntu-latest
    steps:
      - name: getting commit hash
        id: commit
        uses: prompt/actions-commit-hash@v4

      - name: storing short hash
        env:
          SHORT_SHA: ${{steps.commit.outputs.short}}
        run: |
          echo " SHORT_HASH = $SHORT_SHA"
  build-and-push:
    needs: pre-build
    runs-on: ubuntu-latest
    steps:
      - name: git-chechout
        uses: actions/checkout@v7

      - name: docker-image-build
        env:
          unique_tag: ${{inputs.IMAGE_NAME_DEV}}:$SHORT_SHA
          redable_tag: ${{inputs.IMAGE_NAME_DEV}}:latest
        run: |
          echo "unique_tag = $unique_tag"
          echo "readable_tag = $readable_tag"
    
        
        
          

